<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Details — Online Library Store</title>
<meta name="description" content="Full details, gallery, publisher, and ISBN for this title from the Online Library Book Store." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%231c6b46%27/%3E%3Cpath d=%27M6 18.5A2 2 0 0 1 8 16.5H18%27 stroke=%27white%27 stroke-width=%272%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M8 4H18v16H8A2 2 0 0 1 6 18V6A2 2 0 0 1 8 4Z%27 stroke=%27white%27 stroke-width=%272%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1c6b46" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="details">

  <div id="loadingScreen">
    <div class="loader-book"><span></span></div>
    <p>Fetching this title…</p>
  </div>

  <!-- ============================= NAVBAR ============================= -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        </span>
        Online Library
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-nav="home">Home</a>
        <a href="index.html#departments" data-nav="home">Departments</a>
        <a href="index.html#books" data-nav="home">Books</a>
        <a href="store.html" data-nav="store" class="active">Book Store</a>
        <a href="index.html#contact" data-nav="home">Contact</a>
      </nav>

      <div class="nav-icons">
        <button class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button>
        <button class="icon-btn nav-toggle" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================= BOOK DETAILS ============================= -->
  <section>
    <div class="container">
      <a href="store.html" class="back-link">← Back to the store</a>
      <div class="details-grid">
        <div class="details-gallery" id="detailsGallery"><!-- injected by script.js --></div>
        <div class="details-info" id="detailsInfo"><!-- injected by script.js --></div>
      </div>
    </div>
  </section>

  <!-- ============================= FOOTER ============================= -->
  <footer>
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0;">
        <span>© 2026 Online Library. Built for students.</span>
        <a href="admin.html" style="color:rgba(255,255,255,.65);">Admin Panel</a>
      </div>
    </div>
  </footer>

  <button id="backToTop" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div id="toastHost"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
